name: Release

# Cut a release by bumping the version in syrup-calculator.html
# (the <meta name="app-version"> tag), committing to main, then pushing a
# matching tag:
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# This publishes a GitHub Release with the tool attached. The live demo is
# served by GitHub Pages directly from the main branch
# (Settings -> Pages -> "Deploy from a branch": main / root), so every push to
# main updates the site automatically -- no deploy step is needed here.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version to release (e.g., v1.0.1)'
        required: true
        type: string

permissions:
  contents: write   # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so tag overrides can check existing tags safely

      - name: Resolve version and handle tags
        id: ver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Determine the raw tag and cleaned version number string
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          
          CLEAN_VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"

          # 2. Overwrite and create tag if running manually via workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
              echo "⚠️ Tag $TAG already exists. Deleting old release and tag to overwrite..."
              gh release delete "$TAG" --yes --cleanup-tag || true
              git tag -d "$TAG" || true
              git push origin --delete "$TAG" || true
            fi
            
            echo "🚀 Force creating tag $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@://github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Stamp version into the page (safety net for the asset)
        run: |
          ver='${{ steps.ver.outputs.version }}'
          sed -i "s|<meta name=\"app-version\" content=\"[^\"]*\">|<meta name=\"app-version\" content=\"${ver}\">|" syrup-calculator.html

      - name: Package release assets
        run: |
          mkdir -p dist
          cp syrup-calculator.html index.html apple-touch-icon.png README.md dist/
          (cd dist && zip -qr ../syrup-calculator.zip .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            syrup-calculator.html
            syrup-calculator.zip
